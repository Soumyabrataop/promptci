# Example: run PromptCI in GitHub Actions against a local Ollama server.
# Copy this to .github/workflows/promptci.yml in the repo whose prompts you want to test.
name: promptci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prompt-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PromptCI
        run: pip install git+https://github.com/Soumyabrataop/promptci.git

      - name: Install Ollama (open-weight models, runs on the runner)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /dev/null 2>&1 &
          sleep 3
          ollama pull llama3.2

      - name: Check the environment
        run: promptci doctor

      - name: Run prompt regression tests (frozen snapshots)
        run: promptci run --frozen
