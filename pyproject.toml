[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptci"
version = "0.1.0"
description = "CI for LLM workflows: YAML pipelines, prompt templates, and regression gates — runs on open-weight models, on your laptop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soumyabrata" }]
keywords = ["llm", "ci", "prompt", "testing", "ollama", "open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
promptci = "promptci.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/promptci"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# typer's idiom is function calls in argument defaults; the CLI surfaces any
# error (including unexpected ones) as a clean exit code on purpose.
"src/promptci/cli.py" = ["B008", "BLE001"]
"src/promptci/doctor.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
